name: kiem
on: [push, pull_request]
jobs:
  kiem:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      # mọi file .py trong git, không chỉ doc_voice.py; SyntaxWarning (ví dụ dấu \ lạ trong chuỗi) tính là lỗi
      - run: python -W error::SyntaxWarning -m compileall -q -f (git ls-files '*.py')
      - run: python -m pyflakes (git ls-files '*.py')
      - run: python kiem_tra_doc_voice.py
