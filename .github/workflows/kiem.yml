name: kiem
on: [push, pull_request]
jobs:
  kiem:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m compileall -q doc_voice.py
      - run: python -m pyflakes doc_voice.py
      - run: python kiem_tra_doc_voice.py
